<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-labelledby="title description">
  <title id="title">VeRL-Omni Diffusion V1 training architecture</title>
  <desc id="description">Prompt batches flow through the Ray V1 trainer and diffusion rollout, reward scoring, TransferQueue, ReplayBuffer, and actor updates. Updated weights return to rollout. Sync and separate asynchronous modes differ in placement and overlap.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#52667f" />
    </marker>
    <marker id="arrow-updated" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#6d55c7" />
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #15253a; }
      .subtitle { font: 15px Arial, sans-serif; fill: #52667f; }
      .section { font: 700 13px Arial, sans-serif; letter-spacing: 1.1px; fill: #52667f; }
      .box { fill: #fff; stroke: #c9d5e3; stroke-width: 1.5; rx: 12; }
      .box-blue { fill: #eef5ff; stroke: #9dbce7; }
      .box-purple { fill: #f3efff; stroke: #b6a9e5; }
      .box-green { fill: #edf8f3; stroke: #a6d0ba; }
      .box-gold { fill: #fff7e8; stroke: #e5c98f; }
      .head { font: 700 17px Arial, sans-serif; fill: #1b2c43; }
      .body { font: 13px Arial, sans-serif; fill: #43566e; }
      .small { font: 12px Arial, sans-serif; fill: #52667f; }
      .arrow { fill: none; stroke: #52667f; stroke-width: 2; marker-end: url(#arrow); }
      .updated { fill: none; stroke: #6d55c7; stroke-width: 2; marker-end: url(#arrow-updated); }
      .label-bg { fill: #f7f9fc; }
      .mode-title { font: 700 16px Arial, sans-serif; fill: #1b2c43; }
      .mode-body { font: 13px Arial, sans-serif; fill: #43566e; }
    </style>
  </defs>

  <rect width="1280" height="740" fill="#f7f9fc" />
  <text class="title" x="40" y="48">VeRL-Omni Diffusion V1</text>
  <text class="subtitle" x="40" y="76">Online diffusion RL: from prompt batches to policy updates, with queue-backed rollout data</text>
  <text class="section" x="40" y="117">ROLLOUT AND DATA COLLECTION</text>

  <rect class="box" x="40" y="140" width="170" height="140" />
  <text class="head" x="58" y="177">Prompt data</text>
  <text class="body" x="58" y="204">Dataset and dataloader</text>
  <text class="body" x="58" y="226">Prompt batches</text>

  <rect class="box box-blue" x="245" y="140" width="190" height="140" />
  <text class="head" x="263" y="177">Ray V1 trainer</text>
  <text class="body" x="263" y="204">main_diffusion_v1</text>
  <text class="body" x="263" y="226">Selects sync mode</text>
  <text class="body" x="263" y="248">or separate_async</text>

  <rect class="box box-blue" x="470" y="140" width="210" height="140" />
  <text class="head" x="488" y="177">Diffusion rollout</text>
  <text class="body" x="488" y="204">AgentLoopManagerTQ</text>
  <text class="body" x="488" y="226">Agent loop + vLLM-Omni</text>
  <text class="body" x="488" y="248">Samples media trajectories</text>

  <rect class="box box-gold" x="710" y="140" width="170" height="140" />
  <text class="head" x="728" y="177">Reward scoring</text>
  <text class="body" x="728" y="204">Configured reward loop</text>
  <text class="body" x="728" y="226">or colocated scorer</text>
  <text class="body" x="728" y="248">Adds score and metadata</text>

  <rect class="box box-green" x="920" y="140" width="210" height="140" />
  <text class="head" x="938" y="177">TransferQueue</text>
  <text class="body" x="938" y="204">Media / latent payloads</text>
  <text class="body" x="938" y="226">Rewards, group IDs</text>
  <text class="body" x="938" y="248">and policy-step metadata</text>

  <path class="arrow" d="M210 210 H245" />
  <path class="arrow" d="M435 210 H470" />
  <path class="arrow" d="M680 210 H710" />
  <path class="arrow" d="M880 210 H920" />

  <text class="section" x="40" y="337">TRAINING AND WEIGHT UPDATES</text>
  <rect class="box" x="260" y="365" width="220" height="125" />
  <text class="head" x="278" y="402">Checkpoint + logs</text>
  <text class="body" x="278" y="429">Actor and dataloader state</text>
  <text class="body" x="278" y="451">Queue state for async resume</text>

  <rect class="box box-purple" x="560" y="365" width="270" height="125" />
  <text class="head" x="578" y="402">Actor worker group</text>
  <text class="body" x="578" y="429">Advantage → diffusion loss</text>
  <text class="body" x="578" y="451">Optimizer updates actor policy</text>

  <rect class="box box-green" x="900" y="365" width="240" height="125" />
  <text class="head" x="918" y="402">ReplayBuffer</text>
  <text class="body" x="918" y="429">Forms sampleable batches</text>
  <text class="body" x="918" y="451">Tracks groups and staleness</text>

  <path class="arrow" d="M1025 280 V365" />
  <text class="small" x="1038" y="326">consume rows</text>
  <path class="arrow" d="M900 427 H830" />
  <text class="small" x="836" y="414">sample batch</text>
  <path class="arrow" d="M560 427 H480" />
  <path class="updated" d="M695 365 V325 H585 V280" />
  <rect class="label-bg" x="592" y="307" width="116" height="18" rx="4" />
  <text class="small" x="598" y="320" fill="#6d55c7">updated weights</text>

  <rect class="box" x="40" y="535" width="570" height="132" />
  <text class="mode-title" x="62" y="568">sync</text>
  <text class="mode-body" x="62" y="595">Actor and rollout are colocated. The trainer waits for a complete rollout</text>
  <text class="mode-body" x="62" y="617">batch, updates the actor, then refreshes rollout weights for the next step.</text>

  <rect class="box" x="640" y="535" width="600" height="132" />
  <text class="mode-title" x="662" y="568">separate_async</text>
  <text class="mode-body" x="662" y="595">Standalone rollout can overlap actor updates. ReplayBuffer feeds the</text>
  <text class="mode-body" x="662" y="617">configured mini-batches; rollout weights refresh at each sync interval.</text>
  <text class="small" x="662" y="645">The interval is set by trainer.v1.separate_async.parameter_sync_step.</text>

  <text class="small" x="40" y="710">Core diffusion V1 path. Model, reward, loss, and distributed backend are configuration-dependent.</text>
</svg>
