name: gpu_smoke_verl_latest

# Temporarily disabled — uncomment push/pull_request triggers to re-enable.
on:
  workflow_dispatch:

# Cancel jobs on the same ref if a new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Declare permissions just read content.
permissions:
  contents: read

env:
  IMAGE: "verl-ci-cn-beijing.cr.volces.com/verlai/verl:uv.cu130"
  DYNAMIC_RUNNER_ENDPOINT: "https://sd7upeujs1b9g1a958pn0.apigateway-cn-beijing.volceapi.com/runner"

jobs:
  setup:
    if: >-
      github.repository_owner == 'verl-project' && (
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
      )
    runs-on: ubuntu-latest
    outputs:
      runner-label: ${{ steps.create-runner.outputs.runner-label }}
      mlp-task-id: ${{ steps.create-runner.outputs.mlp-task-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: create-runner
        uses: volcengine/vemlp-github-runner@v1
        with:
          mode: "create"
          faas-url: "${{ env.DYNAMIC_RUNNER_ENDPOINT }}"
          mlp-image: "${{ env.IMAGE }}"

  gpu_smoke_tests:
    needs: setup
    runs-on: ["${{ needs.setup.outputs.runner-label || 'L20x8' }}"]
    timeout-minutes: 30
    # Informational only — failures here do not block PRs
    continue-on-error: true
    env:
      HTTP_PROXY: "http://100.68.174.87:3128"
      HTTPS_PROXY: "http://100.68.174.87:3128"
      NO_PROXY: "localhost,127.0.0.1,hf-mirror.com"
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      UV_LINK_MODE: copy
      UV_SYSTEM_PYTHON: "1"
      UV_BREAK_SYSTEM_PACKAGES: "1"
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Keep the uv cache on the runner's persistent HOME
        run: |
          echo "HOME=${HOME} (uv cache baked into the image: ${UV_CACHE_DIR})"
          echo "UV_CACHE_DIR=${HOME}/.cache/uv" | tee -a "${GITHUB_ENV}"
      - name: Install dependencies (verl latest main)
        # Informational only — install issues against latest verl must not fail the workflow.
        continue-on-error: true
        env:
          UV_EXTRA_INDEX_URL: https://pypi.org/simple
          PIP_EXTRA_INDEX_URL: https://pypi.org/simple
          UV_SYSTEM_PYTHON: "1"
          UV_BREAK_SYSTEM_PACKAGES: "1"
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: |
          export UV_CACHE_DIR="${UV_CACHE_DIR:-${HOME}/.cache/uv}"
          git config --global http.postBuffer 524288000 || true
          # Base image PyPI mirror may lag pypi.org (e.g. kernels, fa3-fwd).
          uv pip install --system --break-system-packages ".[gpu,dev,audio]"
          uv pip install --system --break-system-packages "vllm-omni @ git+https://github.com/vllm-project/vllm-omni.git@$(cat .github/vllm_omni_pin.txt)"
          uv pip install --system --break-system-packages --no-deps --reinstall "verl @ git+https://github.com/verl-project/verl.git@main"
          uv pip install --system --break-system-packages --no-deps -e .
          if ! command -v python >/dev/null 2>&1; then
            ln -sfn "$(command -v python3)" /usr/local/bin/python
          fi
      - name: Run GPU smoke tests (verl latest main)
        # Informational only — failures here are expected when latest verl drifts and must not fail the workflow.
        continue-on-error: true
        run: |
          ray stop --force
          bash tests/gpu_smoke/run_gpu_smoke_tests.sh --num-gpus 8

  cleanup:
    runs-on: ubuntu-latest
    needs: [setup, gpu_smoke_tests]
    if: always()
    steps:
      - id: destroy-runner
        uses: volcengine/vemlp-github-runner@v1
        with:
          mode: "destroy"
          faas-url: "${{ env.DYNAMIC_RUNNER_ENDPOINT }}"
          mlp-task-id: "${{ needs.setup.outputs.mlp-task-id }}"
