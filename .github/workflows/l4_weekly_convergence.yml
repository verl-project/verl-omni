name: l4_weekly_convergence

on:
  schedule:
    # Weekly, Saturday 22:00 Asia/Shanghai.
    - cron: "0 14 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - baseline
          - preflight
      cases:
        description: "Comma-separated case_ids (empty runs every recipe)"
        required: false
        default: ""
      num_gpus:
        description: "Number of GPUs available to the recipes"
        required: false
        default: "8"
      output_root:
        description: "Output directory for results, logs, and the release report"
        required: false
        default: outputs/l4_convergence
      baseline_branch:
        description: "Branch whose latest baseline artifact should be used"
        required: false
        default: main
      timeout_minutes:
        description: "Optional per-case timeout override, in minutes"
        required: false
        default: ""
  pull_request:
    branches:
      - main
      - v0.*
    types: [labeled]
    paths:
      - "verl_omni/**"
      - "examples/**"
      - "tests/convergence/**"
      - "pyproject.toml"
      - ".github/workflows/l4_weekly_convergence.yml"
      - ".github/vllm_omni_pin.txt"
      - ".github/verl_pin.txt"

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}-${{ github.event.inputs.mode || 'verify' }}"
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

# Read-only. L4 never writes to the repository and never needs a secret beyond the
# job token used to download the reviewed baseline artifact.
permissions:
  actions: read
  contents: read

env:
  IMAGE: "verl-ci-cn-beijing.cr.volces.com/verlai/verl:uv.cu130"
  DYNAMIC_RUNNER_ENDPOINT: "https://sd7upeujs1b9g1a958pn0.apigateway-cn-beijing.volceapi.com/runner"
  BASELINE_ARTIFACT_NAME: l4-convergence-baseline
  BASELINE_STAGING_ARTIFACT_PREFIX: l4-convergence-baseline-staging
  CURRENT_ARTIFACT_PREFIX: l4-convergence-current
  REPORT_ARTIFACT_PREFIX: l4-convergence-reports
  RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'verify' }}
  RUN_CASES: ${{ github.event.inputs.cases || '' }}
  NUM_GPUS: ${{ github.event.inputs.num_gpus || '8' }}
  OUTPUT_ROOT: ${{ github.event.inputs.output_root || 'outputs/l4_convergence' }}
  BASELINE_BRANCH: ${{ github.event.inputs.baseline_branch || 'main' }}
  TIMEOUT_MINUTES: ${{ github.event.inputs.timeout_minutes || '' }}
  NIGHTLY_PIN_KERNELS: "0.16.0"
  NIGHTLY_PIN_FA3_FWD: "0.0.3"
  NIGHTLY_PIN_TRANSFORMERS: "5.14.1"

jobs:
  setup:
    if: >-
      github.repository_owner == 'verl-project' && (
        github.event_name != 'pull_request' ||
        github.event.label.name == 'L4-convergence-ci'
      )
    runs-on: ubuntu-latest
    outputs:
      runner-label: ${{ steps.create-runner.outputs.runner-label }}
      mlp-task-id: ${{ steps.create-runner.outputs.mlp-task-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download latest L4 baseline artifact
        if: env.RUN_MODE == 'verify'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          artifact_row="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --paginate \
              --jq ".artifacts[] | select(.name == \"${BASELINE_ARTIFACT_NAME}\" and .expired == false and .workflow_run.head_branch == \"${BASELINE_BRANCH}\") | [.created_at, .id] | @tsv" \
              | sort -r \
              | awk 'NR == 1 { print }'
          )"

          if [ -z "${artifact_row}" ]; then
            echo "No non-expired ${BASELINE_ARTIFACT_NAME} artifact found for branch ${BASELINE_BRANCH}."
            echo "Create one with workflow_dispatch mode=baseline before running verify mode."
            exit 1
          fi

          artifact_id="$(printf '%s' "${artifact_row}" | awk '{ print $2 }')"
          echo "Downloading ${BASELINE_ARTIFACT_NAME} artifact ${artifact_id} from branch ${BASELINE_BRANCH}."

          rm -rf /tmp/l4-convergence-baseline "${OUTPUT_ROOT}/baseline"
          mkdir -p /tmp/l4-convergence-baseline "${OUTPUT_ROOT}/baseline"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/l4-convergence-baseline.zip
          unzip -q /tmp/l4-convergence-baseline.zip -d /tmp/l4-convergence-baseline

          shopt -s dotglob nullglob
          cp -a /tmp/l4-convergence-baseline/* "${OUTPUT_ROOT}/baseline/"

      - name: Upload L4 baseline staging artifact
        if: env.RUN_MODE == 'verify'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASELINE_STAGING_ARTIFACT_PREFIX }}-${{ github.run_id }}
          path: ${{ env.OUTPUT_ROOT }}/baseline
          if-no-files-found: error
          retention-days: 1

      - id: create-runner
        uses: volcengine/vemlp-github-runner@v1
        with:
          mode: "create"
          faas-url: "${{ env.DYNAMIC_RUNNER_ENDPOINT }}"
          mlp-image: "${{ env.IMAGE }}"

  l4_convergence_tests:
    name: L4 Convergence Tests
    needs: setup
    # L4 needs production-class hardware. Replace this label (or pass a different
    # runner) once a cluster is dedicated to convergence validation; the recipe
    # preconditions will keep reporting `skipped` on anything smaller.
    runs-on: ["${{ needs.setup.outputs.runner-label || 'L20x8' }}"]
    timeout-minutes: 720
    env:
      HTTP_PROXY: "http://100.68.174.87:3128"
      HTTPS_PROXY: "http://100.68.174.87:3128"
      NO_PROXY: "localhost,127.0.0.1,hf-mirror.com"
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      UV_LINK_MODE: copy
      UV_SYSTEM_PYTHON: "1"
      UV_BREAK_SYSTEM_PACKAGES: "1"
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Keep the uv cache on the runner's persistent HOME
        run: |
          echo "HOME=${HOME} (uv cache baked into the image: ${UV_CACHE_DIR})"
          echo "UV_CACHE_DIR=${HOME}/.cache/uv" | tee -a "${GITHUB_ENV}"

      - name: Install dependencies
        env:
          UV_EXTRA_INDEX_URL: https://pypi.org/simple
          PIP_EXTRA_INDEX_URL: https://pypi.org/simple
        run: |
          export UV_CACHE_DIR="${UV_CACHE_DIR:-${HOME}/.cache/uv}"
          git config --global http.postBuffer 524288000 || true
          uv pip install --system --break-system-packages ".[gpu,dev,audio]"
          uv pip install --system --break-system-packages "kernels==${NIGHTLY_PIN_KERNELS}"
          uv pip install --system --break-system-packages "fa3-fwd==${NIGHTLY_PIN_FA3_FWD}"
          uv pip install --system --break-system-packages "vllm-omni @ git+https://github.com/vllm-project/vllm-omni.git@$(cat .github/vllm_omni_pin.txt)"
          uv pip install --system --break-system-packages --no-deps --reinstall "verl @ git+https://github.com/verl-project/verl.git@$(cat .github/verl_pin.txt)"
          uv pip install --system --break-system-packages --no-deps -e .
          uv pip install --system --break-system-packages veomni==0.1.11 --no-deps
          uv pip install --system --break-system-packages torchcodec librosa soundfile av audioread
          uv pip install --system --break-system-packages "transformers[mistral-common]==${NIGHTLY_PIN_TRANSFORMERS}"
          if ! command -v python >/dev/null 2>&1; then
            ln -sfn "$(command -v python3)" /usr/local/bin/python
          fi

      - name: Validate L4 recipes without touching the GPU
        run: |
          set -euo pipefail
          python3 -m tests.convergence.run_convergence \
            --registry tests/convergence/recipes \
            --output-root "${OUTPUT_ROOT}" \
            --mode preflight \
            || echo "::warning::Some L4 recipes declared prerequisites that this runner does not satisfy."

      - name: Download L4 baseline from setup job
        if: env.RUN_MODE == 'verify'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASELINE_STAGING_ARTIFACT_PREFIX }}-${{ github.run_id }}
          path: ${{ env.OUTPUT_ROOT }}/baseline

      - name: Run L4 convergence gate
        run: |
          set -euo pipefail
          export MODE="${RUN_MODE}"
          export OUTPUT_ROOT="${OUTPUT_ROOT}"
          export L4_CASES="${RUN_CASES}"
          if [ -n "${TIMEOUT_MINUTES}" ]; then
            export L4_TIMEOUT_MINUTES="${TIMEOUT_MINUTES}"
          fi
          ray stop --force || true
          bash tests/convergence/run_l4_convergence.sh

      - name: Upload current L4 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CURRENT_ARTIFACT_PREFIX }}-${{ github.run_id }}
          path: |
            ${{ env.OUTPUT_ROOT }}/current/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload L4 baseline artifact
        if: always() && env.RUN_MODE == 'baseline'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASELINE_ARTIFACT_NAME }}
          path: |
            ${{ env.OUTPUT_ROOT }}/baseline/**
          if-no-files-found: error
          retention-days: 90

      - name: Upload L4 release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPORT_ARTIFACT_PREFIX }}-${{ github.run_id }}
          path: |
            ${{ env.OUTPUT_ROOT }}/release_readiness.json
            ${{ env.OUTPUT_ROOT }}/release_readiness.md
            ${{ env.OUTPUT_ROOT }}/current/**/result.json
            ${{ env.OUTPUT_ROOT }}/current/**/train.log
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize L4 release readiness
        if: always()
        run: |
          set -euo pipefail
          report="${OUTPUT_ROOT}/release_readiness.md"
          if [ -f "${report}" ]; then
            cat "${report}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

  cleanup:
    runs-on: ubuntu-latest
    needs: [setup, l4_convergence_tests]
    if: always() && needs.setup.outputs.mlp-task-id != ''
    steps:
      - id: destroy-runner
        uses: volcengine/vemlp-github-runner@v1
        with:
          mode: "destroy"
          faas-url: "${{ env.DYNAMIC_RUNNER_ENDPOINT }}"
          mlp-task-id: "${{ needs.setup.outputs.mlp-task-id }}"
