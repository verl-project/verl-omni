name: l3_nightly

on:
  schedule:
    # 22:00 Asia/Shanghai.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - baseline
      num_gpus:
        description: "Number of GPUs to use"
        required: false
        default: "1"
      model_path:
        description: "Optional local Qwen-Image model path"
        required: false
        default: ""
      reward_model_path:
        description: "Optional local Qwen-VL reward model path"
        required: false
        default: ""
      output_root:
        description: "Output directory for dumps, logs, and reports"
        required: false
        default: outputs/debug_dumps
      baseline_branch:
        description: "Branch whose latest baseline artifact should be used"
        required: false
        default: main
  pull_request:
    branches:
      - main
      - v0.*
    types: [labeled]
    paths:
      - "verl_omni/**"
      - "tests/nightly/**"
      - "pyproject.toml"
      - ".github/workflows/l3_nightly.yml"
      - ".github/vllm_omni_pin.txt"
      - ".github/verl_pin.txt"

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'nightly' || github.event.inputs.mode || 'nightly' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  actions: read
  contents: read

env:
  IMAGE: "verl-ci-cn-beijing.cr.volces.com/verlai/verl:uv.cu130"
  DYNAMIC_RUNNER_ENDPOINT: "https://sd7upeujs1b9g1a958pn0.apigateway-cn-beijing.volceapi.com/runner"
  BASELINE_ARTIFACT_NAME: l3-nightly-baseline
  BASELINE_STAGING_ARTIFACT_PREFIX: l3-nightly-baseline-staging
  CURRENT_ARTIFACT_PREFIX: l3-nightly-current
  REPORT_ARTIFACT_PREFIX: l3-nightly-reports
  RUN_MODE: ${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'pull_request' && 'nightly' || github.event.inputs.mode || 'nightly' }}
  NUM_GPUS: ${{ github.event.inputs.num_gpus || '1' }}
  MODEL_PATH: ${{ github.event.inputs.model_path || '' }}
  REWARD_MODEL_PATH: ${{ github.event.inputs.reward_model_path || '' }}
  OUTPUT_ROOT: ${{ github.event.inputs.output_root || 'outputs/debug_dumps' }}
  BASELINE_BRANCH: ${{ github.event.inputs.baseline_branch || 'main' }}

jobs:
  setup:
    if: >-
      github.repository_owner == 'verl-project' && (
        github.event_name != 'pull_request' ||
        github.event.label.name == 'L3-nightly-ci'
      )
    runs-on: ubuntu-latest
    outputs:
      runner-label: ${{ steps.create-runner.outputs.runner-label }}
      mlp-task-id: ${{ steps.create-runner.outputs.mlp-task-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download latest L3 baseline artifact
        if: env.RUN_MODE == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          artifact_row="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --paginate \
              --jq ".artifacts[] | select(.name == \"${BASELINE_ARTIFACT_NAME}\" and .expired == false and .workflow_run.head_branch == \"${BASELINE_BRANCH}\") | [.created_at, .id] | @tsv" \
              | sort -r \
              | awk 'NR == 1 { print }'
          )"

          if [ -z "${artifact_row}" ]; then
            echo "No non-expired ${BASELINE_ARTIFACT_NAME} artifact found for branch ${BASELINE_BRANCH}."
            echo "Create one with workflow_dispatch mode=baseline before running nightly mode."
            exit 1
          fi

          artifact_id="$(printf '%s' "${artifact_row}" | awk '{ print $2 }')"
          echo "Downloading ${BASELINE_ARTIFACT_NAME} artifact ${artifact_id} from branch ${BASELINE_BRANCH}."

          rm -rf /tmp/l3-nightly-baseline "${OUTPUT_ROOT}/baseline"
          mkdir -p /tmp/l3-nightly-baseline "${OUTPUT_ROOT}/baseline"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/l3-nightly-baseline.zip
          unzip -q /tmp/l3-nightly-baseline.zip -d /tmp/l3-nightly-baseline

          shopt -s dotglob nullglob
          cp -a /tmp/l3-nightly-baseline/* "${OUTPUT_ROOT}/baseline/"

      - name: Upload L3 baseline staging artifact
        if: env.RUN_MODE == 'nightly'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASELINE_STAGING_ARTIFACT_PREFIX }}-${{ github.run_id }}
          path: ${{ env.OUTPUT_ROOT }}/baseline
          if-no-files-found: error
          retention-days: 1

      - id: create-runner
        uses: volcengine/vemlp-github-runner@v1
        with:
          mode: "create"
          faas-url: "${{ env.DYNAMIC_RUNNER_ENDPOINT }}"
          mlp-image: "${{ env.IMAGE }}"

  l3_nightly_tests:
    name: L3 Nightly Tests
    needs: setup
    runs-on: ["${{ needs.setup.outputs.runner-label || 'L20x8' }}"]
    timeout-minutes: 180
    env:
      HTTP_PROXY: "http://100.68.174.87:3128"
      HTTPS_PROXY: "http://100.68.174.87:3128"
      NO_PROXY: "localhost,127.0.0.1,hf-mirror.com"
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      UV_LINK_MODE: copy
      UV_SYSTEM_PYTHON: "1"
      UV_BREAK_SYSTEM_PACKAGES: "1"
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      NIGHTLY_PIN_KERNELS: "0.14.1"
      NIGHTLY_PIN_FA3_FWD: "0.0.3"
      NIGHTLY_PIN_FLASH_ATTN: "2.8.3"
      NIGHTLY_PIN_TRANSFORMERS: "5.14.1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Keep the uv cache on the runner's persistent HOME
        run: |
          echo "HOME=${HOME} (uv cache baked into the image: ${UV_CACHE_DIR})"
          echo "UV_CACHE_DIR=${HOME}/.cache/uv" | tee -a "${GITHUB_ENV}"

      - name: Install dependencies
        env:
          UV_EXTRA_INDEX_URL: https://pypi.org/simple
          PIP_EXTRA_INDEX_URL: https://pypi.org/simple
          UV_SYSTEM_PYTHON: "1"
          UV_BREAK_SYSTEM_PACKAGES: "1"
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: |
          export UV_CACHE_DIR="${UV_CACHE_DIR:-${HOME}/.cache/uv}"
          git config --global http.postBuffer 524288000 || true
          # Base image PyPI mirror may lag pypi.org (e.g. kernels, fa3-fwd).
          uv pip install --system --break-system-packages ".[gpu,dev,audio]"
          uv pip install --system --break-system-packages "kernels==${NIGHTLY_PIN_KERNELS}"
          uv pip install --system --break-system-packages "fa3-fwd==${NIGHTLY_PIN_FA3_FWD}"
          uv pip install --system --break-system-packages "flash-attn==${NIGHTLY_PIN_FLASH_ATTN}"
          uv pip install --system --break-system-packages "vllm-omni @ git+https://github.com/vllm-project/vllm-omni.git@$(cat .github/vllm_omni_pin.txt)"
          uv pip install --system --break-system-packages --no-deps --reinstall "verl @ git+https://github.com/verl-project/verl.git@$(cat .github/verl_pin.txt)"
          uv pip install --system --break-system-packages --no-deps -e .
          # veomni's [gpu] extra pins torch 2.9 and would conflict with the vLLM stack.
          # See docs/start/install.md "Optional engine backends".
          # TODO: rm --no-deps when VeOmni supports torch2.11.
          uv pip install --system --break-system-packages veomni==0.1.11 --no-deps
          uv pip install --system --break-system-packages torchcodec librosa soundfile av audioread
          uv pip install --system --break-system-packages "transformers[mistral-common]==${NIGHTLY_PIN_TRANSFORMERS}"
          python3 -c "import importlib.metadata as m; print('[NIGHTLY] pinned deps:', 'transformers='+m.version('transformers'), 'kernels='+m.version('kernels'), 'fa3-fwd='+m.version('fa3-fwd'), 'flash-attn='+m.version('flash-attn'))"
          # TODO: Remove this FusedMoE compatibility patch after verl is upgraded to 0.9.0 (which natively supports vLLM 0.27 MoE modular refactor).
          # vLLM 0.27 compatibility: install lazy .pth hook so all Ray workers/subprocesses alias FusedMoE
          python3 -c "import site, os; code = '''import importlib.util, sys\nfrom importlib.abc import Loader, MetaPathFinder\n\nclass _MoEHookFinder(MetaPathFinder):\n    def find_spec(self, fullname, path, target=None):\n        if fullname == \'vllm.model_executor.layers.fused_moe.layer\':\n            sys.meta_path.remove(self)\n            try:\n                spec = importlib.util.find_spec(fullname)\n                if spec and spec.loader:\n                    orig_loader = spec.loader\n                    class _HookedLoader(Loader):\n                        def create_module(self, spec):\n                            return orig_loader.create_module(spec)\n                        def exec_module(self, module):\n                            orig_loader.exec_module(module)\n                            if not hasattr(module, \'FusedMoE\'):\n                                import vllm.model_executor.layers.fused_moe as _m\n                                module.FusedMoE = getattr(_m, \'FusedMoEExpertsModular\', getattr(_m, \'FusedMoEMethodBase\', object))\n                    spec.loader = _HookedLoader()\n                return spec\n            finally:\n                sys.meta_path.insert(0, self)\n        return None\n\nsys.meta_path.insert(0, _MoEHookFinder())\n'''; [open(os.path.join(p, '_vllm_moe_compat.py'), 'w').write(code) for p in set(site.getsitepackages()) if os.path.exists(p)]; [open(os.path.join(p, 'verl_omni_vllm_compat.pth'), 'w').write('import _vllm_moe_compat\n') for p in set(site.getsitepackages()) if os.path.exists(p)]"
          if ! command -v python >/dev/null 2>&1; then
            ln -sfn "$(command -v python3)" /usr/local/bin/python
          fi

      - name: Download L3 baseline from setup job
        if: env.RUN_MODE == 'nightly'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASELINE_STAGING_ARTIFACT_PREFIX }}-${{ github.run_id }}
          path: ${{ env.OUTPUT_ROOT }}/baseline

      - name: Run Qwen-Image FlowGRPO L3 regression
        run: |
          set -euo pipefail

          export NUM_GPUS="${NUM_GPUS}"
          export OUTPUT_ROOT="${OUTPUT_ROOT}"
          if [ -n "${MODEL_PATH}" ]; then
            export MODEL_PATH="${MODEL_PATH}"
          fi
          if [ -n "${REWARD_MODEL_PATH}" ]; then
            export REWARD_MODEL_PATH="${REWARD_MODEL_PATH}"
          fi

          if [ "${RUN_MODE}" = "baseline" ]; then
            export BOOTSTRAP_MISSING_BASELINE=1
          else
            export BOOTSTRAP_MISSING_BASELINE=0
          fi

          ray stop --force
          bash tests/nightly/qwen_image_flowgrpo/run_qwen_image_flowgrpo.sh

      - name: Upload current nightly artifacts
        if: always() && env.RUN_MODE == 'nightly'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CURRENT_ARTIFACT_PREFIX }}-${{ github.run_id }}
          path: |
            ${{ env.OUTPUT_ROOT }}/current/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload baseline artifact
        if: always() && env.RUN_MODE == 'baseline'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASELINE_ARTIFACT_NAME }}
          path: |
            ${{ env.OUTPUT_ROOT }}/baseline/**
          if-no-files-found: error
          retention-days: 90

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPORT_ARTIFACT_PREFIX }}-${{ github.run_id }}
          path: |
            ${{ env.OUTPUT_ROOT }}/current/**/metrics.json
            ${{ env.OUTPUT_ROOT }}/current/**/dump_compare.json
            ${{ env.OUTPUT_ROOT }}/current/**/metrics.jsonl
            ${{ env.OUTPUT_ROOT }}/logs/**
          if-no-files-found: ignore
          retention-days: 30

  cleanup:
    runs-on: ubuntu-latest
    needs: [setup, l3_nightly_tests]
    if: always() && needs.setup.outputs.mlp-task-id != ''
    steps:
      - id: destroy-runner
        uses: volcengine/vemlp-github-runner@v1
        with:
          mode: "destroy"
          faas-url: "${{ env.DYNAMIC_RUNNER_ENDPOINT }}"
          mlp-task-id: "${{ needs.setup.outputs.mlp-task-id }}"
