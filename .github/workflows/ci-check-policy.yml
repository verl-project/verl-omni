name: Lint

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: false
      - name: Run pre-commit lint hooks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run --no-project --python 3.12 python tests/special_sanity/check_ci_policy.py "$BASE_SHA" "$HEAD_SHA"
          uvx --python 3.12 pre-commit run check-code --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA"
          uvx --python 3.12 pre-commit run ruff --all-files --show-diff-on-failure
          uvx --python 3.12 pre-commit run ruff-format --all-files --show-diff-on-failure
      - name: Exercise checker regressions
        run: >-
          uv run --no-project --python 3.12 --with pytest --with pyyaml --with ruff==0.12.2 pytest -q
          tests/special_sanity/test_ci_policy.py tests/special_sanity/test_check_*.py
