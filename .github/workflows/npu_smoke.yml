name: npu_smoke

on:
  push:
    branches:
      - main
      - v0.*
    paths:
      - "verl_omni/**"
      - "tests/npu_smoke/**"
      - "tests/workers/**"
      - "tests/special_e2e/**"
      - "pyproject.toml"
      - .github/workflows/npu_smoke.yml
      - .github/vllm_omni_pin.txt
  pull_request:
    branches:
      - main
      - v0.*
    types: [labeled]
    paths:
      - "verl_omni/**"
      - "tests/npu_smoke/**"
      - "tests/workers/**"
      - "tests/special_e2e/**"
      - "pyproject.toml"
      - .github/workflows/npu_smoke.yml
      - .github/vllm_omni_pin.txt

# Declare permissions just read content and PR file metadata.
permissions:
  contents: read
  pull-requests: read

jobs:
  setup_runner:
    # Pull requests run only after a CI label is applied:
    #   ready-for-ci                    -> all NPU tests as part of full PR validation
    #   ci-npu                         -> all NPU tests for targeted NPU validation
    #   ci-npu-core                   -> test 0
    #   ci-npu-e2e                    -> tests 1 and 2
    # Pushes to main and release branches run the full suite.
    if: >-
      github.repository_owner == 'verl-project' &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'ready-for-ci') ||
       contains(github.event.pull_request.labels.*.name, 'ci-npu') ||
       contains(github.event.pull_request.labels.*.name, 'ci-npu-core') ||
       contains(github.event.pull_request.labels.*.name, 'ci-npu-e2e'))
    runs-on: linux-aarch64-a2b4-8
    timeout-minutes: 120
    container:
      image: swr.cn-north-4.myhuaweicloud.com/mindspeed/pr-verl-omni-a2:latest
      options: >-
        --shm-size 16g
    env:
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0" # This is more stable
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      TRANSFORMERS_VERBOSITY: 'error'
    steps:
      - name: Check npu and CANN info
        run: |
          cat /usr/local/Ascend/ascend-toolkit/latest/"$(uname -i)"-linux/ascend_toolkit_install.info
          npu-smi info
          echo "===== Ascend/NPU environment ====="
          env | LC_ALL=C sort | grep -E "(/usr/local/Ascend/|^(ASCEND|ATB|HCCL|NPU|DEVICE_|RANK_TABLE|RAY_EXPERIMENTAL_NOSET_ASCEND))" || true
      - name: Resolve NPU CI mode
        id: resolve-mode
        shell: bash
        run: |
          mode="none"
          pr_labels="${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            mode="all"
          elif [[ ",${pr_labels}," == *",ready-for-ci,"* ]]; then
            mode="all"
          elif [[ ",${pr_labels}," == *",ci-npu,"* ]]; then
            mode="all"
          elif [[ ",${pr_labels}," == *",ci-npu-core,"* ]]; then
            mode="ci-npu-core"
          elif [[ ",${pr_labels}," == *",ci-npu-e2e,"* ]]; then
            mode="ci-npu-e2e"
          else
            mode="none"
          fi

          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.resolve-mode.outputs.mode != 'none'
      - name: Prepare tiny Qwen-Image checkpoint
        if: steps.resolve-mode.outputs.mode != 'none'
        run: |
          MODEL_PATH="${HOME}/.cache/modelscope/hub/models/tiny-random/Qwen-Image"
          if [[ -d "${MODEL_PATH}" ]]; then
            echo "Reusing existing tiny Qwen-Image checkpoint at ${MODEL_PATH}"
          else
            python tests/special_e2e/build_qwen_image_tiny_random.py --output-dir "${MODEL_PATH}"
          fi
      - name: Prepare tiny Wan2.2 checkpoint
        if: steps.resolve-mode.outputs.mode == 'all' || steps.resolve-mode.outputs.mode == 'ci-npu-e2e'
        run: |
          MODEL_PATH="${HOME}/.cache/models/tiny-random/Wan2.2-TI2V-5B-Diffusers"
          python tests/special_e2e/build_wan22_tiny_random.py \
            --output-dir "${MODEL_PATH}" \
            --verify-load
      - name: Upgrade vLLM stack
        if: steps.resolve-mode.outputs.mode != 'none'
        shell: bash
        run: |
          set -euxo pipefail
          
          echo "===== Installed versions ====="
          pip show vllm || true
          pip show vllm-ascend || true
          pip show vllm-omni || true
      - id: resolve-groups
        if: steps.resolve-mode.outputs.mode != 'none'
        shell: bash
        run: |
          mode="${{ steps.resolve-mode.outputs.mode }}"

          if [[ "${mode}" == "all" ]]; then
            plan_json='{
              "test_ids": ["0", "1", "2"],
              "group_count": 3,
              "num_npus": 8,
              "runner_size": 8
            }'
          elif [[ "${mode}" == "ci-npu-core" ]]; then
            plan_json='{
              "test_ids": ["0"],
              "group_count": 1,
              "num_npus": 8,
              "runner_size": 8
            }'
          elif [[ "${mode}" == "ci-npu-e2e" ]]; then
            plan_json='{
              "test_ids": ["1", "2"],
              "group_count": 2,
              "num_npus": 8,
              "runner_size": 8
            }'
          else
            echo "Unknown NPU smoke mode: ${mode}"
            exit 1
          fi

          echo "Resolved NPU smoke plan: ${plan_json}"

          PLAN_JSON="${plan_json}" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          plan = json.loads(os.environ["PLAN_JSON"])
          print(f"group-count={plan['group_count']}")
          print(f"num-npus={plan['num_npus']}")
          print(f"runner-size={plan['runner_size']}")
          print(f"test-ids={' '.join(plan['test_ids'])}")
          PY
      - name: Run NPU smoke tests
        if: steps.resolve-mode.outputs.mode != 'none'
        shell: bash
        run: |
          bash tests/npu_smoke/run_npu_smoke_tests.sh \
            --num-npus "${{ steps.resolve-groups.outputs.num-npus }}" \
            ${{ steps.resolve-groups.outputs.test-ids }}
