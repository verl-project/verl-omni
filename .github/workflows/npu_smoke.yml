name: npu_smoke

on:
  push:
    branches:
      - main
      - v0.*
    paths:
      - "verl_omni/**"
      - "tests/npu_smoke/**"
      - "tests/agent_loop/**"
      - "tests/reward_loop/**"
      - "tests/workers/**"
      - "tests/special_e2e/**"
      - "pyproject.toml"
      - ".github/workflows/npu_smoke.yml"
      - .github/vllm_omni_pin.txt
  pull_request:
    branches:
      - main
      - v0.*
    types: [labeled]
    paths:
      - "verl_omni/**"
      - "tests/npu_smoke/**"
      - "tests/agent_loop/**"
      - "tests/reward_loop/**"
      - "tests/workers/**"
      - "tests/special_e2e/**"
      - "pyproject.toml"
      - ".github/workflows/npu_smoke.yml"
      - .github/vllm_omni_pin.txt

# Declare permissions just read content and PR file metadata.
permissions:
  contents: read
  pull-requests: read

jobs:
  resolve_groups:
    # Pull requests run only after a CI label is applied:
    #   ready-for-ci                    -> all NPU tests as part of full PR validation
    #   ci-npu                         -> all NPU tests for targeted NPU validation
    #   ci-npu-core                   -> core group
    #   ci-npu-e2e                    -> e2e group
    # Pushes to main and release branches run the full suite.
    if: >-
      github.repository_owner == 'verl-project' &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'ready-for-ci') ||
       contains(github.event.pull_request.labels.*.name, 'ci-npu') ||
       contains(github.event.pull_request.labels.*.name, 'ci-npu-core') ||
       contains(github.event.pull_request.labels.*.name, 'ci-npu-e2e'))
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.resolve-groups.outputs.groups }}
    steps:
      - name: Resolve NPU CI groups
        id: resolve-groups
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.labels.*.name) || '[]' }}
        run: |
          python3 - <<'PY'
          import json
          import os

          label_groups = {
              "ready-for-ci": ("core", "e2e"),
              "ci-npu": ("core", "e2e"),
              "ci-npu-core": ("core",),
              "ci-npu-e2e": ("e2e",),
          }
          labels = json.loads(os.environ["PR_LABELS"]) if os.environ["EVENT_NAME"] == "pull_request" else ["ci-npu"]
          selected = {group for label in labels for group in label_groups.get(label, ())}
          groups = [group for group in ("core", "e2e") if group in selected]
          if not groups:
              raise SystemExit("No NPU smoke groups selected.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"groups={json.dumps(groups)}\n")
          PY

  npu_smoke:
    needs: resolve_groups
    if: needs.resolve_groups.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: ${{ fromJSON(needs.resolve_groups.outputs.groups) }}
    runs-on: linux-aarch64-a2b4-8
    timeout-minutes: 120
    container:
      image: swr.cn-north-4.myhuaweicloud.com/mindspeed/pr-verl-omni-a2:v010-vllm030-omni030
      options: >-
        --shm-size 16g
    env:
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0" # This is more stable
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      TRANSFORMERS_VERBOSITY: 'error'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check NPU and CANN info
        shell: bash
        run: |
          cat /usr/local/Ascend/ascend-toolkit/latest/"$(uname -i)"-linux/ascend_toolkit_install.info
          npu-smi info
          echo "===== Ascend/NPU environment ====="
          env | LC_ALL=C sort | grep -E "(/usr/local/Ascend/|^(ASCEND|ATB|HCCL|NPU|DEVICE_|RANK_TABLE|RAY_EXPERIMENTAL_NOSET_ASCEND))" || true
      - name: Print vLLM stack versions
        shell: bash
        run: |
          pip show vllm || true
          pip show vllm-ascend || true
          pip show vllm-omni || true
      - name: Prepare tiny Qwen-Image checkpoint
        shell: bash
        run: |
          MODEL_PATH="${HOME}/.cache/modelscope/hub/models/tiny-random/Qwen-Image"
          python tests/special_e2e/build_qwen_image_tiny_random.py \
            --output-dir "${MODEL_PATH}"
      - name: Run NPU smoke ${{ matrix.group }} tests
        shell: bash
        env:
          NPU_SMOKE_GROUP: ${{ matrix.group }}
        run: |
          mkdir -p logs/npu_smoke/parallel
          bash "tests/npu_smoke/run_npu_smoke_${NPU_SMOKE_GROUP}.sh" --num-npus 8 \
            2>&1 | tee "logs/npu_smoke/parallel/${NPU_SMOKE_GROUP}.log"
      - name: Upload NPU smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu-smoke-logs-${{ matrix.group }}
          path: logs/npu_smoke/**
          if-no-files-found: ignore

  setup_runner:
    needs: [resolve_groups, npu_smoke]
    if: always() && needs.resolve_groups.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Check selected NPU smoke groups
        env:
          GROUP_SELECTION_RESULT: ${{ needs.resolve_groups.result }}
          NPU_SMOKE_RESULT: ${{ needs.npu_smoke.result }}
        run: |
          [[ "${GROUP_SELECTION_RESULT}" == 'success' && "${NPU_SMOKE_RESULT}" == 'success' ]]
