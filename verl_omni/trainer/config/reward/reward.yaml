# configs for the reward computation

# specify the default per-component configs
defaults:

  # per-role profiler config for the reward-model rollout servers,
  # inheriting from trainer/config/profiler/profiler.yaml
  - ../profiler@reward_model.rollout.profiler: profiler

  # load the reference default config, then apply the fields in the current yaml
  - _self_

# we launch num_workers reward managers to parallelize the reward computation
num_workers: 8

# custom reward function definition
custom_reward_function:
  # The path to the file containing your customized reward function.
  # If not specified, pre-implemented reward functions will be used.
  path: null
  # The name of the reward function within the specified file. Default is 'compute_score'.
  name: compute_score
  # Deprecated alias; use reward.accelerator_workers.enabled instead.
  use_accelerator: false

# Bind legacy custom reward workers to bundles in the trainer-selected
# accelerator pool. Native named models select this automatically; this switch
# only preserves an explicit path for existing custom reward functions.
accelerator_workers:
  enabled: false

# Multi-reward configuration (dict-based, mutually exclusive with custom_reward_function).
# Keys are user-chosen names used for metric logging (e.g., "ocr", "jpeg").
# Each entry: path (str), name (str), weight (float).
reward_functions: {}

# Named reward models. A reward function uses the same-name model by default or
# may reference another entry with ``model: <key>``. Backends are ``engine``
# (vLLM through the existing verl RewardModelManager) and ``native``
# (verl-omni worker-local model). The trainer selects one
# parent global_pool or reward_pool through reward_model.enable_resource_pool;
# MultiRewardModelManager splits that parent pool into disjoint engine and
# native subpools. Native models share one parent native subpool, but each model
# must explicitly claim its own native-pool bundle indices.
# One index creates one full local model instance; this is replication, not TP.
# The indices are relative to the native subpool (not physical CUDA/NPU IDs),
# and cannot overlap between native models.
# Every backend uses the same optional ``offload`` setting: true (default)
# wakes before scoring and sleeps afterward; false keeps the model resident.
# Native model example:
#
# models:
#   quality:
#     backend: native
#     offload: true
#     model_path: /models/quality
#     placement:
#       devices: [0, 1, 2, 3]
#     executor:
#       model: my_package.reward_model:QualityModel
# Engine model example:
#   judge:
#     backend: engine
#     offload: true
#     n_gpus_per_node: 1
#     nnodes: 1
#     model_path: /models/judge
#     rollout:
#       name: vllm
#       tensor_model_parallel_size: 1
# reward_functions:
#   quality:
#     path: pkg://my_package.reward_score
#     name: compute_quality_score
#   judge:
#     path: pkg://my_package.reward_score
#     name: compute_judge_score
# Existing router-based rewards (for example GenRM OCR) may also bind their
# existing path/name function to a model; it receives that model's
# ``reward_router_address`` and ``model_name`` instead of the legacy global
# reward router.
models: {}

# Aggregation method for multi-reward. Only "weighted_sum" is supported.
aggregation: weighted_sum

# reward manager configuration
reward_manager:
  _target_: verl.workers.config.reward_model.RewardManagerConfig
  source: importlib
  name: VisualRewardManager
  module:
    _target_: verl.trainer.config.config.ModuleConfig
    path: pkg://verl_omni.reward_loop.reward_manager

# Inference config for reward models,
# support both discriminative and generative models
reward_model:
  enable: False

  # Select the parent pool for the existing reward_model and named engine models.
  # If true, use a dedicated reward_pool; otherwise, use global_pool.
  # MultiRewardModelManager splits the selected parent pool per named model.
  enable_resource_pool: False
  n_gpus_per_node: 8
  nnodes: 0

  model_path: null
  rollout:
    _target_: verl.workers.config.RolloutConfig

    # Keep reward-server traces out of the actor rollout replicas' directories:
    # the trace subdirectory is named agent_loop_rollout_replica_{rank} for both.
    profiler:
      save_path: ${oc.select:global_profiler.save_path,outputs/profile}/reward_model

    name: ???
    dtype: bfloat16
    gpu_memory_utilization: 0.5
    enforce_eager: true
    cudagraph_capture_sizes: null
    free_cache_engine: true
    data_parallel_size: 1
    expert_parallel_size: 1
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    max_num_batched_tokens: 8192
    max_model_len: null
    max_num_seqs: 1024
    load_format: auto
    layered_summon: false
    scheduling_policy: fcfs
    multi_stage_wake_up: false
    engine_kwargs: {}
    limit_images: null
    enable_chunked_prefill: true
    enable_prefix_caching: true
    disable_log_stats: true
    skip_tokenizer_init: false
    ignore_eos: false
    temperature: 1.0
    top_k: -1
    top_p: 1
    do_sample: true
    n: 1
    seed: 42
    full_determinism: false

    prompt_length: 2048
    response_length: 2048

    quantization: null
    quantization_config_file: null
    mtp: null
    disaggregation:
      enabled: false
      prefill_replicas: 1
      decode_replicas: 1
      decode_tensor_model_parallel_size: null
      transfer_backend: nixl
      bootstrap_port: null
      ib_device: null

# Cloud/local sandbox fusion configuration for custom reward logic
sandbox_fusion:
  # Cloud /local function URL for sandbox execution
  url: null
  # Max concurrent requests allowed to sandbox
  max_concurrent: 64
  # Max memory limit for each sandbox process in MB
  memory_limit_mb: 1024
