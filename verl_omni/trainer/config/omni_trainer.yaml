# Format checks enforced on CI:
# 1. Comments must appear above each field.
# 2. There must be a blank line between each field.
# 3. Inline comments (after a field on the same line) are not allowed.
# 4. Indentation level is respected for nested fields.

hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - omni/model@actor_rollout_ref.model: omni_model
  - agentic/image_gen_tools@agentic_image_gen
  - _self_

# Config for actor, rollout and reference model.
actor_rollout_ref:

  # Rollout config.
  rollout:

    # Use vLLM-Omni as the rollout backend for omni models.
    name: vllm_omni

  # Actor config.
  actor:

    # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
    _target_: verl_omni.workers.config.omni.OmniActorConfig

    # Mirrors algorithm.trainer_type; used by OmniActorConfig.__post_init__ and worker loss dispatch.
    trainer_type: ${algorithm.trainer_type}

    # Omni loss config.
    omni_loss:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl_omni.workers.config.omni.OmniLossConfig

      # Loss function mode.
      loss_mode: dpo

      # DPO inverse temperature.
      beta: 0.1

      # DPO label smoothing.
      label_smoothing: 0.0

      # DPO loss type.
      loss_type: sigmoid

      # Whether to average log probabilities before DPO.
      average_log_prob: false

      # Precision for the reference model.
      refer_model_precision: bfloat16

    # Shuffle training data across PPO epochs.
    shuffle: false

    # Checkpoint config.
    checkpoint:

      # Save only LoRA model weights with the FSDP checkpoint saver.
      save_lora_only: false

# Trainer configuration.
trainer:

  # Port range for torch distributed rendezvous, sliced per worker group. Leave null for ephemeral
  # ports; set it only to isolate concurrent training jobs on one machine.
  ray_master_port_range: null

  # V1 trainer settings.
  v1:

    # Use the omni trainer mode for omni models.
    trainer_mode: omni_sync


# Config for the algorithm.
algorithm:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl_omni.trainer.config.OmniAlgoConfig

  # Trainer loop.
  trainer_type: policy_gradient

  # Sample provenance.
  sample_source: online

  # True for pair-based algorithms such as offline DPO.
  paired_preference: false

  # Advantage estimator placeholder inherited by shared trainer utilities.
  adv_estimator: grpo

  # Whether to normalize advantages by std.
  norm_adv_by_std_in_grpo: true

  # Whether to normalize advantages using global standard deviation.
  global_std: true


# Distillation config. Overrides the top-level, loss, and teacher _target_ so
# vllm_omni and multimodal self-distillation (SDPO/OPSD) are supported while
# inheriting all other defaults from verl's distillation group.
distillation:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl_omni.workers.config.omni.distillation.OmniDistillationConfig

  # On-policy self-distillation (SDPO / OPSD) settings.
  self_teacher:

    # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
    _target_: verl_omni.workers.config.omni.distillation.SelfDistillationConfig

    # Enable multimodal on-policy self-distillation reusing the student rollout server.
    enabled: false

    # Privileged context mode: sdpo, opsd, or auto.
    mode: sdpo

    # Weight source for self-teacher scoring: policy or ema.
    teacher_source: policy

    # Exponential moving average decay used when teacher_source is ema.
    ema_decay: 0.99

    # Fall back to GSPO/GRPO policy gradient on groups without teacher context.
    fallback_to_pg: true

    # Minimum scalar reward required for a sibling rollout to count as a winning demonstration.
    reward_threshold: 0.5

    # Include verifier or environment feedback text when reprompting the self-teacher.
    include_environment_feedback: true

    # Key holding environment or verifier feedback in reward_extra_info or extra_info.
    environment_feedback_key: feedback

    # Key holding reference solutions for OPSD in reward_model or extra_info.
    reference_solution_key: ground_truth

    # Exclude a sample's own winning rollout when selecting a sibling demonstration.
    dont_reprompt_on_self_success: true

    # Preserve multimodal attachments and media placeholder counts during reprompting.
    preserve_multimodal_inputs: true

    # Maximum characters kept from a winning sibling demonstration or reference solution.
    max_demonstration_chars: 4096

    # Maximum characters kept from verifier or environment feedback.
    max_feedback_chars: 2048

    # Optional token budget for the reprompted teacher prompt before trimming privileged text.
    max_reprompt_tokens: null

    # Prompt suffix template appended to the user turn with a {context} placeholder.
    reprompt_template: "\n\nUse the following additional information to guide your reasoning and produce a correct response:\n{context}\n\nProvide a clear, accurate response directly without mentioning the hint."

  # Distillation loss settings.
  distillation_loss:

    # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
    _target_: verl_omni.workers.config.omni.distillation.OmniDistillationLossConfig

    # Temperature for the hidden-state (nitrobrew) distillation loss modes.
    kd_temperature: 1.0

  # External teacher model configurations (unused when self_teacher.enabled is true).
  teacher_models:

    # Default external teacher model entry.
    teacher_model:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl_omni.workers.config.omni.distillation.OmniDistillationTeacherModelConfig
