# Target class for this configuration
_target_: verl_omni.workers.config.diffusion.DiffusionDistillationConfig

# Whether on-policy distillation is enabled.
enabled: false

# Number of GPUs per node in the distillation teacher resource pool
n_gpus_per_node: 0

# Number of nodes in the distillation teacher resource pool. 0 colocates the teachers with the actor.
nnodes: 0

# multi-teacher configs
teacher_models:

  # Single-teacher config. This entry is popped when other teacher entries are added, so
  # using `teacher_model` as one of several keys silently drops it. For
  # example, the following CLI overrides result in ONLY `teacher_model2` being used:
  #
  # distillation.teacher_models.teacher_model.key=ocr
  # distillation.teacher_models.teacher_model.model_path=/ckpt/ocr_teacher
  # +distillation.teacher_models.teacher_model2.key=aesthetic
  # +distillation.teacher_models.teacher_model2.model_path=/ckpt/aesthetic_teacher
  #
  # Instead, give the first teacher a different name:
  #
  # +distillation.teacher_models.teacher_model1.key=ocr
  # +distillation.teacher_models.teacher_model1.model_path=/ckpt/ocr_teacher
  # +distillation.teacher_models.teacher_model2.key=aesthetic
  # +distillation.teacher_models.teacher_model2.model_path=/ckpt/aesthetic_teacher
  teacher_model:

    # Target class for this configuration
    _target_: verl_omni.workers.config.diffusion.DiffusionDistillationTeacherModelConfig

    # Identifier to route examples to this teacher in multi-teacher setups. Auto-set to `default` for a single teacher.
    key: null

    # Local path to the frozen teacher checkpoint (same pipeline family as the student).
    model_path: null

    # Number of GPUs this teacher occupies in the distillation teacher resource pool. A single teacher fills the pool.
    world_size: 0

# Key to route examples to the appropriate teacher model in multi-teacher setups. Should correspond to a field in the data proto, e.g., data_source.
teacher_key: data_source

# DMD-family settings used only when algorithm.trainer_type=distillation. Keep enabled=false; that flag belongs to OPD.
distribution_matching:

  # Target class for this configuration
  _target_: verl_omni.workers.config.diffusion.DiffusionDistributionMatchingConfig

  # Registered recipe name
  recipe: dmd2

  # Optional recipe profile; null selects the recipe default
  profile: null

  # Optional fake-score phase count; null selects the recipe default
  fake_update_ratio: null

  # Number of fake/discriminator-only cycles before student updates begin
  fake_warmup_cycles: 0

  # Optional registered rollout override; null selects the recipe default
  rollout_strategy: null

  # Optional data-mode override; null selects the recipe default
  data_mode: null

  # Semantic role exported to inference replicas
  export_role: student_ema

  # Physical role storage: shared_base_adapters or colocated_independent
  role_storage: shared_base_adapters

  # Per-device micro-batch size for student phases
  student_micro_batch_size_per_gpu: 1

  # Per-device micro-batch size for fake-score phases
  fake_score_micro_batch_size_per_gpu: 1

  # Independent fake-score optimizer and scheduler configuration
  fake_score_optim:

    # Target optimizer configuration class
    _target_: verl.workers.config.FSDPOptimizerConfig

    # Optimizer class name
    optimizer: AdamW

    # Python module containing the optimizer class
    optimizer_impl: torch.optim

    # Fake-score learning rate
    lr: 2.0e-5

    # Warmup steps ratio when lr_warmup_steps is non-positive
    lr_warmup_steps_ratio: 0.0

    # Total fake-score optimizer steps; populated by the trainer
    total_training_steps: -1

    # Weight decay
    weight_decay: 0.01

    # Explicit warmup steps; non-positive delegates to the ratio
    lr_warmup_steps: -1

    # Adam beta coefficients
    betas: [0.9, 0.999]

    # Gradient clipping threshold
    clip_grad: 1.0

    # Minimum learning-rate ratio for cosine scheduling
    min_lr_ratio: 0.0

    # Number of cosine cycles
    num_cycles: 0.5

    # Learning-rate scheduler type
    lr_scheduler_type: constant

    # Whether scheduler step counting starts at zero
    zero_indexed_step: true

    # Deprecated scheduler alias
    warmup_style: null

    # Optional optimizer implementation overrides
    override_optimizer_config: null

  # EMA decay after a completed student optimizer step
  ema_decay: 0.999

  # First completed student step that updates EMA
  ema_start_step: 0
