# Shared native ImageBind deployment for the H3 and LTX2 recipes.
backend: native

model_path: .checkpoints/imagebind_huge.pth

# Reuse the loaded weights across reward phases, as in the local scorer.
offload: false

placement:
  # Bundle indices in the trainer-selected parent pool. The default needs at least two bundles.
  # For a one-bundle pool, pass 'reward.models.imagebind.placement.devices=[0]' to the launcher.
  devices: [1]

executor:
  model: verl_omni.utils.reward_score.imagebind:ImageBindModel
