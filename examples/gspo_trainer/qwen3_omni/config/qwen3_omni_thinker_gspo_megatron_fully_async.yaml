# Qwen3-Omni Thinker GSPO full-model fully-async training config.
#
# This recipe uses a Megatron actor/reference and node-local standalone
# vLLM-Omni AR rollout replicas. Cluster topology, model/data paths, and the
# number of training steps remain launch-time overrides.

hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_megatron_trainer
  - _self_

async_training:
  staleness_threshold: 0.1
  trigger_parameter_sync_step: 4
  require_batches: 1
  partial_rollout: true
  use_trainer_do_validate: false

rollout:
  nnodes: 1
  n_gpus_per_node: 8
  n: 4
  total_rollout_steps: 100

data:
  gen_batch_size: 1

actor_rollout_ref:
  hybrid_engine: false

  model:
    _target_: verl_omni.workers.config.omni.OmniModelConfig
    model_type: omni_model
    model_stage: thinker
    use_remove_padding: true
    lora_rank: 0

  actor:
    strategy: megatron
    use_rollout_log_probs: true

  rollout:
    name: vllm_omni
    mode: async
    calculate_log_probs: true
    data_parallel_size: 1
    engine_kwargs:
      vllm_omni:
        output_mode: ar
    checkpoint_engine:
      backend: nccl

  ref:
    strategy: megatron

algorithm:
  rollout_correction:
    bypass_mode: true
